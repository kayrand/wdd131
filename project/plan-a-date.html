<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan a Date – Hello Date Night</title>
    <meta name="description" content="Get personalized date night ideas at Hello Date Night. Share your preferences and receive a custom date suggestion just for you.">
    <meta name="author" content="Kaylee Godfrey">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/plan-a-date.js" defer></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="Hello Date Night logo" class="logo">
            </a>
            <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
            <nav id="main-nav">
                <a href="index.html">Home</a>
                <a href="date-ideas.html">Date Ideas</a>
                <a href="plan-a-date.html" class="active">Plan a Date</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-intro">
            <h1>Plan a Date</h1>
            <p>Tell us what you're in the mood for and we'll suggest the perfect date idea for you and your special someone.</p>
        </section>

        <section class="form-section">
            <form id="date-form">
                <h2>Share Your Preferences</h2>

                <label for="budget">What's your budget?</label>
                <select id="budget" name="budget" required>
                    <option disabled selected value="">Choose a budget...</option>
                    <option value="free">Free</option>
                    <option value="$">$ Under $25</option>
                    <option value="$$">$$ $25 - $75</option>
                    <option value="$$$">$$$ $75 and up</option>
                </select>

                <label class="group-label">What's the vibe?</label>
                <div class="form-group">
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="vibe-cozy" name="vibe" value="cozy">
                            <label for="vibe-cozy">Cozy</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="vibe-adventurous" name="vibe" value="adventure">
                            <label for="vibe-adventurous">Adventurous</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="vibe-romantic" name="vibe" value="romantic">
                            <label for="vibe-romantic">Romantic</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="vibe-fun" name="vibe" value="fun">
                            <label for="vibe-fun">Fun</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="vibe-relaxing" name="vibe" value="cozy">
                            <label for="vibe-relaxing">Relaxing</label>
                        </div>
                    </div>
                </div>

                <label class="group-label">Indoor or outdoor?</label>
                <div class="form-group">
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="location-indoor" name="location" value="indoor" required>
                            <label for="location-indoor">Indoor</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="location-outdoor" name="location" value="outdoor" required>
                            <label for="location-outdoor">Outdoor</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="location-either" name="location" value="either" required>
                            <label for="location-either">Either</label>
                        </div>
                    </div>
                </div>

                <label for="time">How much time do you have?</label>
                <select id="time" name="time" required>
                    <option disabled selected value="">Choose a time...</option>
                    <option value="1">About an hour</option>
                    <option value="2">2 to 3 hours</option>
                    <option value="4">Half a day</option>
                    <option value="8">All day or evening</option>
                </select>

                <label for="food">Food preference</label>
                <select id="food" name="food">
                    <option disabled selected value="">Choose an option...</option>
                    <option value="cooking">Cooking together</option>
                    <option value="takeout">Takeout</option>
                    <option value="restaurant">Eat at a restaurant</option>
                    <option value="none">No food needed</option>
                </select>

                <label for="notes">Any special notes? (Optional)</label>
                <textarea id="notes" name="notes" rows="4"></textarea>

                <label for="username">Your name (Optional)</label>
                <input type="text" id="username" name="username">

                <input type="submit" value="Get My Date Idea">
            </form>

            <div id="result-section" class="result-section">
                <h2 id="result-greeting">Your Perfect Date Idea</h2>
                <article class="result-card">
                    <img id="result-image" src="" alt="" loading="lazy">
                    <div class="card-content">
                        <h3 id="result-name"></h3>
                        <p id="result-description"></p>
                        <div class="card-details">
                            <span class="card-tag" id="result-cost"></span>
                            <span class="card-tag" id="result-time"></span>
                        </div>
                        <p id="result-notes" class="result-notes"></p>
                    </div>
                </article>
                <button id="try-again" class="cta-button-outline">Try Again</button>
            </div>
        </section>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> Hello Date Night by Kaylee Godfrey</p>
        <p id="lastModified"></p>
        <p><a href="references.html">References</a></p>
    </footer>
</body>
</html>
