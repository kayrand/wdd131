<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Temple Album – Kaylee Godfrey</title>
    <meta name="description" content="A picture album featuring nine temples from around the world, created by Kaylee Godfrey for WDD 131 Dynamic Web Fundamentals.">
    <meta name="author" content="Kaylee Godfrey">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <span id="course-title">Temple Album</span>
        <button id="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
        <nav id="main-nav" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temples of the World</h1>

        <div class="gallery">
            <figure>
                <img src="images/boise.jpeg" alt="Boise Idaho Temple on a sunny day" loading="lazy" width="400" height="300">
                <figcaption>Boise Idaho Temple</figcaption>
            </figure>

            <figure>
                <img src="images/boston.jpeg" alt="Boston Massachusetts Temple in winter" loading="lazy" width="400" height="300">
                <figcaption>Boston Massachusetts Temple</figcaption>
            </figure>

            <figure>
                <img src="images/calgary.jpeg" alt="Calgary Alberta Temple exterior" loading="lazy" width="400" height="300">
                <figcaption>Calgary Alberta Temple</figcaption>
            </figure>

            <figure>
                <img src="images/birmingham.jpeg" alt="Birmingham Alabama Temple with grounds sign" loading="lazy" width="400" height="300">
                <figcaption>Birmingham Alabama Temple</figcaption>
            </figure>

            <figure>
                <img src="images/barranquilla.jpeg" alt="Barranquilla Colombia Temple at sunset" loading="lazy" width="400" height="300">
                <figcaption>Barranquilla Colombia Temple</figcaption>
            </figure>

            <figure>
                <img src="images/adelaide.jpeg" alt="Adelaide Australia Temple exterior" loading="lazy" width="400" height="300">
                <figcaption>Adelaide Australia Temple</figcaption>
            </figure>

            <figure>
                <img src="images/albuquerque.jpeg" alt="Albuquerque New Mexico Temple with fountain" loading="lazy" width="400" height="300">
                <figcaption>Albuquerque New Mexico Temple</figcaption>
            </figure>

            <figure>
                <img src="images/accra.jpeg" alt="Accra Ghana Temple at twilight" loading="lazy" width="400" height="300">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/abidjan.jpeg" alt="Abidjan Ivory Coast Temple rendering" loading="lazy" width="400" height="300">
                <figcaption>Abidjan Ivory Coast Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Kaylee Godfrey 🌸 Alabama, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
