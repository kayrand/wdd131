<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – New Zealand – Kaylee Godfrey</title>
    <meta name="description" content="Explore New Zealand — a country of stunning landscapes, rich Māori culture, and unforgettable adventure. Created by Kaylee Godfrey for WDD 131.">
    <meta name="author" content="Kaylee Godfrey">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>New Zealand</h1>
    </header>

    <main>
        <picture class="hero">
            <source srcset="images/new-zealand-medium.jpg" media="(min-width: 1000px)">
            <source srcset="images/new-zealand-small.jpg" media="(min-width: 600px)">
            <img src="images/new-zealand-large.jpg" alt="Queenstown overlooking Lake Wakatipu, New Zealand">
        </picture>

        <section class="data">
            <h2>Data</h2>
            <ul>
                <li><strong>Capital:</strong> Wellington</li>
                <li><strong>Population:</strong> 5.1 million</li>
                <li><strong>Languages:</strong> English, Māori</li>
                <li><strong>Currency:</strong> NZ Dollar (NZD)</li>
                <li><strong>Area:</strong> 268,021 km²</li>
            </ul>
        </section>

        <section class="weather">
            <h2>Weather</h2>
            <img src="images/weather-icon.svg" alt="Partly cloudy weather icon" class="weather-icon">
            <ul>
                <li><strong>Condition:</strong> Partly Cloudy</li>
                <li><strong>Temperature:</strong> 8 &deg;C</li>
                <li><strong>Wind:</strong> 12 km/h</li>
                <li><strong>Humidity:</strong> 65%</li>
                <li><strong>Wind Chill:</strong> <span id="windchill"></span></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Kaylee Godfrey 🌸 Alabama, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
